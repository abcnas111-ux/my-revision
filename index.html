            { id: 25, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'كشاف كهربي شحنته سالبة والزاوية بين ورقتيه 50 درجة، عند تقريب جسم مشحون بشحنة سالبة قد تصبح الزاوية ...............', options: ['30 درجة', '40 درجة', '50 درجة', '60 درجة'], ans: 3, exp: 'يزداد انفراج الورقتين لتشابه الشحنتين فتصبح الزاوية أكبر من 50 درجة (مثل 60 درجة).' },
            { id: 26, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'كشاف كهربي معزول قُرِّب منه موصل مشحون بشحنة موجبة دون ملامسته، ثم لُمس قرص الكشاف باليد وأُبعد الموصل، يصبح الكشاف ...............', options: ['مشحوناً بشحنة سالبة وورقتاه منفرجتان', 'مشحوناً بشحنة سالبة وورقتاه منطبقتان', 'مشحوناً بشحنة موجبة', 'غير مشحون'], ans: 0, exp: 'يُشحن الكشاف بالتأثير بشحنة مخالفة لشحنة المؤثر (سالبة) وتنفرج ورقتاه.' },
            { id: 27, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'الترتيب الصحيح للمواد التالية في السلسلة الكهروستاتيكية من أعلى إلى أسفل هو ...............', options: ['الزجاج - الحرير - الخشب - القطن - الأبونيت', 'الأبونيت - القطن - الحرير - الزجاج', 'الحرير - الزجاج - الأبونيت - القطن', 'القطن - الأبونيت - الزجاج - الحرير'], ans: 0, exp: 'الزجاج في الأعلى ثم الحرير ثم الخشب ثم القطن وأسفلهم الأبونيت.' },
            { id: 28, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تتدلى من سيارات نقل الوقود سلاسل معدنية تلامس الأرض بهدف ...............', options: ['زيادة سرعة السيارة', 'تفريغ الشحنات الساكنة في الأرض', 'توليد كهرباء للسيارة', 'حفظ توازن السيارة'], ans: 1, exp: 'لتفريغ الشحنات المتولدة من احتكاك الوقود بجدران الخزان منعاً لحدوث شرارة.' },
            { id: 29, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'الجسيمات التي لا تنحرف عند مرورها في مجال كهربي هي ...............', options: ['الإلكترونات', 'البروتونات', 'النيوترونات', 'أيونات الصوديوم'], ans: 2, exp: 'النيوترونات متعادلة الشحنة الكهربية فلا تتأثر بالمجال الكهربي.' },
            { id: 30, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تصنع ورقتا الكشاف الكهربي من رقائق ...............', options: ['الحديد أو النحاس', 'الذهب أو الألومنيوم', 'البلاستيك أو الورق', 'الزجاج أو الخشب'], ans: 1, exp: 'تصنع من الذهب أو الألومنيوم لخفتهما الشديدة وتأثرهما بأقل شحنة كهربية.' },
            { id: 31, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'العالم الذي وضع قانون التربيع العكسي في القوى الكهربية هو ...............', options: ['نيوتن', 'كولوم', 'هوفمان', 'أوم'], ans: 1, exp: 'العالم الفرنسي شارل كولوم وضع قانون التربيع العكسي للقوى الكهربية.' },
            { id: 32, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'عند دلك ساق من الخشب بقطعة من الحرير ثم تقريبها من ساق زجاج مدلوكة بالحرير يحدث بينهما ...............', options: ['تجاذب', 'تنافر', 'انصهار', 'لا يحدث شيء'], ans: 0, exp: 'الزجاج يكتسب شحنة موجبة والخشب يكتسب شحنة سالبة عند دلكهما بالحرير، فيحدث تجاذب.' },
            { id: 33, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'المادة (Y) اكتسبت إلكترونات عند دلكها بـ (Z)، وفقدت إلكترونات عند دلكها بـ (X). الترتيب من أعلى لأسفل في السلسلة هو ...............', options: ['X ثم Y ثم Z', 'Z ثم Y ثم X', 'Y ثم Z ثم X', 'Z ثم X ثم Y'], ans: 1, exp: 'Z فقدت لـ Y فهي أعلاها، و Y فقدت لـ X فهي أعلى من X، فيكون الترتيب Z ثم Y ثم X.' },
            { id: 34, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'القوى الكهربية بين الشحنات المتشابهة تكون قوى ............... وبين المختلفة تكون قوى ...............', options: ['تجاذب - تنافر', 'تنافر - تجاذب', 'احتكاك - مرونة', 'تصادم - مجال'], ans: 1, exp: 'الشحنات المتشابهة تتنافر، والشحنات المختلفة تتجاذب.' },

            // --- الدرس الثاني: القوى المغناطيسية (33 سؤال) ---
            { id: 35, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المغناطيس الطبيعي أحد خامات ............... المعروف باسم الماجنيتيت.', options: ['النحاس', 'الألومنيوم', 'الحديد', 'الفضة'], ans: 2, exp: 'المغناطيس الطبيعي هو أحد خامات الحديد (أكسيد الحديد المغناطيسي).' },
            { id: 36, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'كل مما يأتي من أشكال المغناطيس الصناعي عدا ...............', options: ['إبرة مغناطيسية', 'قضيب مغناطيسي', 'حدوة حصان', 'قطعة ألومنيوم'], ans: 3, exp: 'الألومنيوم مادة غير مغناطيسية ولا يصنع منه مغناطيس.' },
            { id: 37, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تصنع علبة البوصلة من ............... حتى لا تؤثر على حركة الإبرة المغناطيسية.', options: ['الحديد المطاوع', 'البلاستيك أو النحاس', 'الحديد الصلب', 'الكوبلت'], ans: 1, exp: 'تصنع من مادة غير مغناطيسية كالبلاستيك أو النحاس حتى لا تعيق حرية حركة الإبرة.' },
            { id: 38, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'من المواد التي تنجذب إلى المغناطيس ...............', options: ['الفضة', 'الألومنيوم', 'النيكل', 'النحاس'], ans: 2, exp: 'الحديد والنيكل والكوبلت من المواد المغناطيسية التي تنجذب للمغناطيس.' },
            { id: 39, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تعليق مغناطيس حر الحركة من منتصفه فإنه يأخذ اتجاه ...............', options: ['الشمال والشرق', 'الشرق والغرب', 'الشمال والجنوب', 'الغرب والشمال'], ans: 2, exp: 'يتخذ المغناطيس الحر دائماً اتجاه الشمال والجنوب الجغرافيين للأرض.' },
            { id: 40, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب مغناطيس من مخلوط يحتوي على برادة فضة ونحاس وحديد وألومنيوم وكوبلت، فإن المواد التي تنجذب هي ...............', options: ['الحديد فقط', 'الفضة والنحاس فقط', 'الحديد والكوبلت فقط', 'الألومنيوم والفضة فقط'], ans: 2, exp: 'الحديد والكوبلت فقط من المواد المغناطيسية في هذا المخلوط.' },
            { id: 41, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تعليق مغناطيس صناعي تعليقاً حراً من منتصفه فإن القطب الشمالي له يشير إلى القطب ............... الجغرافي للأرض.', options: ['الشمالي', 'الجنوبي', 'الشرقي', 'الغربي'], ans: 0, exp: 'يشير القطب الشمالي للمغناطيس المعلق إلى الشمال الجغرافي للأرض.' },
            { id: 42, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تجزئة المغناطيس الواحد إلى عدة أجزاء فإن كل جزء يكون عبارة عن مغناطيس له ...............', options: ['قطب واحد', 'قطبان', 'ثلاثة أقطاب', 'أربعة أقطاب'], ans: 1, exp: 'لا يوجد قطب مغناطيسي منفرد؛ كل جزء مهما صغر يصبح مغناطيساً جديداً له قطبان.' },
            { id: 43, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'كل مما يلي مواد غير مغناطيسية ما عدا ...............', options: ['النحاس (Cu)', 'الحديد (Fe)', 'الفضة (Ag)', 'الألومنيوم (Al)'], ans: 1, exp: 'الحديد (Fe) مادة مغناطيسية تنجذب للمغناطيس، بينما الباقي مواد غير مغناطيسية.' },
            { id: 44, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'أي مما يلي لا يعد من خواص المغناطيس؟', options: ['له قطبان شمالي وجنوبي', 'تزداد قوة جذبه عند الطرفين', 'يأخذ اتجاهاً ثابتاً عند تعليقه حراً', 'يجذب جميع المواد المعدنية'], ans: 3, exp: 'المغناطيس يجذب المواد المغناطيسية فقط ولا يجذب كل المعادن مثل الذهب والنحاس.' },
            { id: 45, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتجه خطوط المجال المغناطيسي خارج المغناطيس ...............', options: ['من القطب S إلى القطب N', 'من القطب N إلى القطب S', 'بشكل دائري حول المنتصف', 'بدون اتجاه ثابت'], ans: 1, exp: 'تتجه خطوط المجال المغناطيسي من القطب الشمالي (N) إلى القطب الجنوبي (S).' },
            { id: 46, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المجال المغناطيسي يكون أقوى ما يمكن عند ...............', options: ['منتصف المغناطيس', 'القطب الشمالي فقط', 'القطب الجنوبي فقط', 'القطبين الشمالي والجنوبي'], ans: 3, exp: 'تتركز قوة المغناطيس وتتزاحم خطوط المجال عند القطبين الشمالي والجنوبي.' },
            { id: 47, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتناقص خطوط المجال المغناطيسي وتنعدم القوة المغناطيسية تقريباً عند ...............', options: ['القطب الشمالي فقط', 'القطب الجنوبي فقط', 'القطب الشمالي والجنوبي', 'منتصف المغناطيس'], ans: 3, exp: 'تقل كثافة خطوط المجال وتنعدم قوة الجذب تقريباً عند منتصف المغناطيس.' },
            { id: 48, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب قطب جنوبي لمغناطيس مع قطب جنوبي لمغناطيس آخر فإنهما ...............', options: ['يتجاذبان', 'يتنافران', 'يتلامسان', 'يصطدمان'], ans: 1, exp: 'الأقطاب المغناطيسية المتشابهة تتنافر.' },
            { id: 49, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند رسم خطوط المجال المغناطيسي بين قطبي مغناطيسين وتظهر متنافرة (متباعدة عن المنتصف)، فإن القطبين يكونان ...............', options: ['شمالي وجنوبي', 'شمالي وشمالي فقط', 'جنوبي وجنوبي فقط', 'متشابهين (شمالي وشمالي أو جنوبي وجنوبي)'], ans: 3, exp: 'تباعد الخطوط يدل على وجود تنافر، مما يعني أن القطبين متشابهان في النوع.' },
            { id: 50, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'كل مما يأتي يصف خواص خطوط المجال المغناطيسي بشكل صحيح ما عدا أنها ...............', options: ['تبدأ من القطب الشمالي وتنتهي عند الجنوبي', 'تكون على شكل خطوط مستقيمة متوازية دائماً', 'خطوط وهمية لا يمكن رؤيتها', 'تتزاحم عند القطبين'], ans: 1, exp: 'خطوط المجال المغناطيسي تكون منحنية مغلقة وليست مستقيمة متوازية دائماً.' },
            { id: 51, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب مغناطيس من ............... فإنه قد ينشأ بينهما قوة تجاذب أو تنافر.', options: ['قطعة نيكل', 'سلك نحاسي', 'مغناطيس آخر', 'قطعة حديد'], ans: 2, exp: 'التنافر لا يحدث إلا بين مغناطيسين، أما المواد المغناطيسية فتنجذب للمغناطيس دائماً.' },
            { id: 52, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يستخدم خبراء الأدلة الجنائية والطب الشرعي برادة ............... وفرشاة مغناطيسية للكشف عن البصمات غير الواضحة.', options: ['النحاس', 'الألومنيوم', 'الحديد', 'الفضة'], ans: 2, exp: 'تلتصق برادة الحديد الناعمة بإفرازات البصمة وتزال الزوائد بالفرشاة المغناطيسية.' },
            { id: 53, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'أداة قديمة تستخدم في تحديد الاتجاهات الجغرافية الأربعة للأرض هي ...............', options: ['الإلكتروسكوب', 'البوصلة', 'الميزان الزنبركي', 'الفولتميتر'], ans: 1, exp: 'البوصلة تعتمد على حرية حركة إبرة مغناطيسية لتحديد الشمال والجنوب.' },
            { id: 54, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'القطب الشمالي لمغناطيس الأرض يقع بالقرب من القطب ............... الجغرافي للأرض.', options: ['الشمالي', 'الجنوبي', 'الشرقي', 'الغربي'], ans: 1, exp: 'القطب الشمالي للمغناطيس المعلق يتجه نحو الشمال الجغرافي لأنه ينجذب للقطب الجنوبي لمغناطيس الأرض.' },
            { id: 55, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يرمز للقطب الشمالي للمغناطيس بالرمز ............... بينما القطب الجنوبي يرمز له بالرمز ...............', options: ['S - N', 'N - S', 'E - W', 'W - E'], ans: 1, exp: 'N ترمز للشمال (North) و S ترمز للجنوب (South).' },
            { id: 56, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'القوة الناشئة بين المغناطيس وقطعة من النيكل تكون قوة ...............', options: ['تجاذب فقط', 'تنافر فقط', 'تجاذب أو تنافر', 'تلامس'], ans: 0, exp: 'النيكل مادة مغناطيسية تنجذب للمغناطيس دائماً ولا تتنافر معه.' },
            { id: 57, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتكون العملات المعدنية النحاسية الحديثة من سبيكة من النحاس والنيكل، لذا عند تقريبها لمغناطيس فإنها ...............', options: ['تنجذب للمغناطيس', 'تتنافر مع المغناطيس', 'لا تتأثر بالمغناطيس', 'تنشطر لنصفين'], ans: 0, exp: 'تنجذب للمغناطيس لاحتوائها على عنصر النيكل المغناطيسي.' },
            { id: 58, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المنطقة المحيطة بالمغناطيس والتي تظهر فيها آثار قوته المغناطيسية تسمى ...............', options: ['القطب المغناطيسي', 'المجال المغناطيسي', 'المجال الكهربي', 'الجاذبية'], ans: 1, exp: 'هذا هو التعريف العلمي للمجال المغناطيسي.' },
            { id: 59, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'ينص قانون التجاذب والتنافر على أن الأقطاب المغناطيسية المتشابهة ............... والأقطاب المختلفة ...............', options: ['تتجاذب - تتنافر', 'تتنافر - تتجاذب', 'تتعادل - تتنافر', 'تتجاذب - تتعادل'], ans: 1, exp: 'الأقطاب المتشابهة تتنافر والأقطاب المختلفة تتجاذب.' },
            { id: 60, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'حجر طبيعي أسود اللون له القدرة على جذب الأجسام المصنوعة من الحديد هو ...............', options: ['الجرانيت', 'الماجنيتيت', 'البازلت', 'الحجر الجيري'], ans: 1, exp: 'الماجنيتيت هو خام الحديد المغناطيسي الطبيعي.' },
            { id: 61, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند غمس مغناطيس في علبة بها برادة حديد ثم رفعه، تتركز البرادة بكثافة عند ...............', options: ['منتصف المغناطيس', 'طرفي المغناطيس (القطبين)', 'السطح العلوي فقط', 'تتوزع بالتساوي'], ans: 1, exp: 'تتركز قوة الجذب المغناطيسي عند القطبين وتنعدم تقريباً في المنتصف.' },
            { id: 62, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'الكلمة المختلفة في المجموعة (الحديد - النحاس - الكوبلت - النيكل) هي ...............', options: ['الحديد', 'النحاس', 'الكوبلت', 'النيكل'], ans: 1, exp: 'النحاس مادة غير مغناطيسية بينما الباقي مواد مغناطيسية.' },
            { id: 63, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'الكلمة المختلفة في المجموعة (حجر مغناطيس - إبرة مغناطيسية - قضيب مغناطيسي - حدوة حصان) هي ...............', options: ['حجر مغناطيس', 'إبرة مغناطيسية', 'قضيب مغناطيسي', 'حدوة حصان'], ans: 0, exp: 'حجر المغناطيس مغناطيس طبيعي بينما الباقي أشكال المغناطيس الصناعي.' },
            { id: 64, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يعبر عن المجال المغناطيسي بخطوط وهمية يمكن الكشف عنها عملياً باستخدام ...............', options: ['برادة النحاس', 'برادة الحديد', 'رمل ناعم', 'ماء مقطر'], ans: 1, exp: 'تترتب برادة الحديد على شكل منحنيات توضح شكل خطوط المجال المغناطيسي.' },
            { id: 65, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب القطب الجنوبي لإبرة البوصلة من القطب الشمالي لقضيب مغناطيسي فإن الإبرة ...............', options: ['تنجذب نحوه', 'تبتعد عنه', 'تدور باستمرار', 'لا تتحرك'], ans: 0, exp: 'القطب الجنوبي للإبرة ينجذب نحو القطب الشمالي للقضيب لاختلافهما في النوع.' },
            { id: 66, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتشابه خطوط المجال الكهربي وخطوط المجال المغناطيسي في أن كليهما ...............', options: ['خطوط وهمية لا تتقاطع', 'تبدأ من الشحنة الموجبة', 'تنتهي عند القطب الجنوبي', 'يمكن رؤيتها بالعين'], ans: 0, exp: 'كلاهما خطوط وهمية تمثل اتجاه القوى في المجال ولا تتقاطع مع بعضها أبداً.' },

            { id: 13, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'عند تقريب جسم مشحون من قرص الكشاف الكهربي غير المشحون تبتعد ورقتا الكشاف عن بعضهما.', ans: true, exp: 'صواب: تنفرج الورقتان لانتقال الشحنات إليهما بالتأثير واكتسابهما نفس الشحنة.' },
            { id: 14, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يمكن تفريغ شحنة الكشاف الكهربي عن طريق لمس القرص باليد.', ans: true, exp: 'صواب: تتسرب الشحنات عبر جسم الإنسان إلى الأرض ويعود الكشاف لحالة التعادل.' },
            { id: 15, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يزداد انفراج ورقتي الكشاف الكهربي عند ملامسة القرص لجسم له نفس الشحنة الكهربية للكشاف.', ans: true, exp: 'صواب: لزيادة كمية الشحنات المتشابهة على الورقتين فتزداد قوة التنافر بينهما.' },
            { id: 16, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يقل انفراج ورقتي الكشاف الكهربي المشحون بشحنة سالبة عند تقريب ساق من الأبونيت تم دلكها بالحرير من قرص الكشاف.', ans: false, exp: 'خطأ: ساق الأبونيت المدلوكة بالحرير شحنتها سالبة (نفس شحنة الكشاف)، لذا يزداد انفراج الورقتين.' },
            { id: 17, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'لا تنحرف النيوترونات عند مرورها في مجال كهربي.', ans: true, exp: 'صواب: لأن النيوترونات جسيمات متعادلة الشحنة الكهربية.' },
            { id: 18, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تتدلى من سيارات نقل الوقود سلاسل معدنية تلامس الأرض لتفريغ الشحنات الساكنة.', ans: true, exp: 'صواب: لمنع حدوث شرارة كهربية قد تسبب اشتعال الوقود.' },
            { id: 19, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تتفق شحنة الدالك مع شحنة المدلوك في النوع وتختلف عنها في المقدار.', ans: false, exp: 'خطأ: تتفق الشحنتان في المقدار وتختلفان في النوع.' },
            { id: 20, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'عند دلك قطعة من الصوف بقطعة من القطن تنتقل الإلكترونات من الصوف إلى القطن.', ans: true, exp: 'صواب: الصوف يسبق القطن في السلسلة الكهروستاتيكية فيفقد إلكترونات وتنتقل للقطن.' },
            { id: 21, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تُشحن ساق الزجاج وساق الخشب بشحنتين متشابهتين عند دلك كل منهما بقطعة من الحرير.', ans: false, exp: 'خطأ: الزجاج يكتسب شحنة موجبة (يسبق الحرير) والخشب يكتسب شحنة سالبة (يلي الحرير).' },
            { id: 22, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'في الطلاء الكهروستاتيكي يُشحن الجسم المراد طلاؤه بشحنة موجبة ورذاذ الطلاء بشحنة سالبة.', ans: false, exp: 'خطأ: يُشحن الجسم المراد طلاؤه بشحنة سالبة ورذاذ الطلاء بشحنة موجبة.' },
            { id: 23, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يستخدم جهاز كولوم ميتر لحماية المباني العالية من الصواعق.', ans: false, exp: 'خطأ: تستخدم مانعة الصواعق، أما كولوم ميتر فيقيس الشحنات الكهربية الضعيفة.' },
            { id: 24, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تنحرف البروتونات ناحية اللوح الموجب عند مرورها في مجال كهربي.', ans: false, exp: 'خطأ: البروتونات موجبة الشحنة فتنحرف ناحية اللوح السالب.' },
            { id: 25, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يُعد الزجاج والأبونيت والخشب من المواد غير الموصلة للكهرباء.', ans: true, exp: 'صواب: وهي مواد عازلة تستقر عليها الشحنات الكهربية الساكنة في موضع الدلك.' },
            { id: 26, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'خطوط القوى الكهربية تخترق أسطح الأجسام المعدنية.', ans: false, exp: 'خطأ: خطوط القوى الكهربية لا تخترق أسطح الأجسام المعدنية وتنتهي عند السطح الخارجي.' },
            { id: 27, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يرتكز قرص الكشاف الكهربي على ساق معدنية تنتهي بورقتين رقيقتين داخل إناء زجاجي.', ans: true, exp: 'صواب: هذا هو التركيب الأساسي لجهاز الإلكتروسكوب (الكشاف الكهربي).' },
            { id: 28, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يُحاط ساق الكشاف الكهربي بسدادة من النحاس لعزله عن الإناء الزجاجي.', ans: false, exp: 'خطأ: يُحاط بسدادة من مادة عازلة مثل المطاط أو الفلين لمنع تسرب الشحنات.' },
            { id: 29, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'عند دلك ساق من الزجاج بقطعة من الحرير تكتسب قطعة الحرير شحنة سالبة.', ans: true, exp: 'صواب: لأن الحرير يكتسب الإلكترونات التي يفقدها الزجاج.' },
            { id: 30, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'تتنافر قطعتان من الحرير بعد دلك كل منهما بقطعة من القطن على حدة.', ans: true, exp: 'صواب: تكتسب كل قطعة حرير شحنة موجبة فتتنافران لتشابه شحنتيهما.' },
            { id: 31, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'الكتلة هو وحدة قياس الشحنة الكهربية.', ans: false, exp: 'خطأ: الكولوم هو وحدة قياس الشحنة الكهربية.' },
            { id: 32, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'يُعد الحرير والصوف والجلد الصناعي من مواد السلسلة الكهروستاتيكية الدالكة.', ans: true, exp: 'صواب: وهي مواد شائعة الاستخدام في دلك الأجسام لتوليد الكهرباء الساكنة.' },
            { id: 33, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'الشحنات الكهربية المتشابهة تتجاذب بينما الشحنات المختلفة تتنافر.', ans: false, exp: 'خطأ: الشحنات المتشابهة تتنافر والشحنات المختلفة تتجاذب.' },
            { id: 34, lesson: 'electric', lessonName: 'القوى الكهربية', q: 'سماع صوت طقطقة خفيفة عند خلع الملابس الصوفية في الشتاء يرجع للكهرباء الساكنة.', ans: true, exp: 'صواب: نتيجة التفريغ الكهربي للشحنات المتولدة من احتكاك الملابس بالجسم.' },

            // --- القوى المغناطيسية (33 سؤال) ---
            { id: 35, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المغناطيس له القدرة على جذب جميع المعادن.', ans: false, exp: 'خطأ: يجذب المواد المغناطيسية فقط مثل الحديد والنيكل والكوبلت.' },
            { id: 36, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يعد الألومنيوم من المواد التي تنجذب للمغناطيس.', ans: false, exp: 'خطأ: الألومنيوم مادة غير مغناطيسية لا تنجذب للمغناطيس.' },
            { id: 37, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'كثافة برادة الحديد تكون أكبر ما يمكن عند منتصف المغناطيس.', ans: false, exp: 'خطأ: تكون أكبر ما يمكن عند قطبي المغناطيس وتنعدم تقريباً في المنتصف.' },
            { id: 38, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تزداد القوى المغناطيسية عند منتصف المغناطيس.', ans: false, exp: 'خطأ: تنعدم القوى المغناطيسية تقريباً عند منتصف المغناطيس وتتركز عند القطبين.' },
            { id: 39, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'لا يمكن الحصول على قطب مغناطيسي منفرد.', ans: true, exp: 'صواب: عند تقسيم المغناطيس لأي عدد من الأجزاء، يظل لكل جزء قطبان شمالي وجنوبي.' },
            { id: 40, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'القطب الشمالي لمغناطيس الأرض يمثل القطب الشمالي الجغرافي للأرض.', ans: false, exp: 'خطأ: القطب الشمالي لمغناطيس الأرض يقع بالقرب من القطب الجنوبي الجغرافي للأرض.' },
            { id: 41, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'القطب الجنوبي للمغناطيس الصناعي يشير إلى القطب الشمالي الجغرافي للأرض.', ans: false, exp: 'خطأ: القطب الجنوبي للمغناطيس يشير إلى القطب الجنوبي الجغرافي للأرض.' },
            { id: 42, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'الأقطاب المغناطيسية المتشابهة تتنافر، والأقطاب المغناطيسية المختلفة تتجاذب.', ans: true, exp: 'صواب: وهذا هو نص قانون التجاذب والتنافر المغناطيسي.' },
            { id: 43, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'خطوط المجال المغناطيسي تبدأ من القطب الشمالي وتنتهي عند القطب الجنوبي.', ans: true, exp: 'صواب: هذا هو الاتجاه الاصطلاحي لخطوط المجال المغناطيسي خارج المغناطيس.' },
            { id: 44, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تنشأ بين المغناطيس والمواد المغناطيسية الموجودة في مجاله قوة تنافر أو تجاذب.', ans: false, exp: 'خطأ: تنشأ بينهما قوة تجاذب فقط.' },
            { id: 45, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'لا تتقاطع خطوط المجال المغناطيسي وتبدأ من القطب (S) للمغناطيس.', ans: false, exp: 'خطأ: لا تتقاطع ولكنها تبدأ من القطب الشمالي (N) وتنتهي عند الجنوبي (S).' },
            { id: 46, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب القطب الشمالي لمغناطيس من القطب الجنوبي لمغناطيس آخر فإنهما يتنافران.', ans: false, exp: 'خطأ: يتجاذبان لأنهما قطبان مختلفان.' },
            { id: 47, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يمكن رؤية خطوط المجال المغناطيسي حول المغناطيس بالعين المجردة.', ans: false, exp: 'خطأ: خطوط المجال المغناطيسي وهمية لا تُرى، ولكن يُستدل عليها باستخدام برادة الحديد.' },
            { id: 48, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المغناطيس الطبيعي حجر أسود اللون يُعرف باسم الماجنيتيت.', ans: true, exp: 'صواب: وهو أحد خامات الحديد الطبيعية.' },
            { id: 49, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'من أشكال المغناطيس الصناعي الإبرة المغناطيسية وحدوة الحصان والحلقة المغناطيسية.', ans: true, exp: 'صواب: يصنع المغناطيس الصناعي بأشكال وأحجام مختلفة تناسب الأغراض المتعددة.' },
            { id: 50, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تصنع علبة البوصلة من الحديد المطاوع لحماية الإبرة المغناطيسية.', ans: false, exp: 'خطأ: تصنع من النحاس أو البلاستيك حتى لا تؤثر على حركة الإبرة.' },
            { id: 51, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تشير الإبرة المغناطيسية حرة الحركة دائماً إلى اتجاهي الشرق والغرب.', ans: false, exp: 'خطأ: تشير دائماً إلى اتجاهي الشمال والجنوب الجغرافيين.' },
            { id: 52, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'النيكل والكوبلت والحديد المطاوع من المواد المغناطيسية.', ans: true, exp: 'صواب: لأنها جميعاً مواد تنجذب للمغناطيس.' },
            { id: 53, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'الفضة والذهب والنحاس والزئبق من المواد غير المغناطيسية.', ans: true, exp: 'صواب: لأنها لا تنجذب للمغناطيس.' },
            { id: 54, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يمكن فصل برادة الحديد عن الدقيق بسهولة باستخدام المغناطيس.', ans: true, exp: 'صواب: تنجذب برادة الحديد للمغناطيس ويبقى الدقيق.' },
            { id: 55, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'المغناطيس الأكبر حجماً يكون دائماً أقوى من المغناطيس الأصغر حجماً.', ans: false, exp: 'خطأ: تتوقف قوة المغناطيس على نوع مادته وكيفية مغنطته وليس حجمه فقط.' },
            { id: 56, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتباعد خطوط المجال المغناطيسي عند الأقطاب وتتقارب في المنتصف.', ans: false, exp: 'خطأ: تتزاحم (تتقارب) عند الأقطاب وتقل في المنتصف.' },
            { id: 57, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تُستخدم البوصلة في تحديد الاتجاهات الجغرافية الأساسية الأربعة للأرض.', ans: true, exp: 'صواب: وهي أداة ملاحية قديمة وأساسية.' },
            { id: 58, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يستخدم خبراء الطب الشرعي برادة النحاس للكشف عن البصمات غير الواضحة.', ans: false, exp: 'خطأ: يستخدمون برادة الحديد الناعمة وفرشاة مغناطيسية.' },
            { id: 59, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'القوة المغناطيسية تعتبر من أمثلة قوى المجال التي تؤثر عن بعد.', ans: true, exp: 'صواب: لأن المغناطيس يجذب المواد المغناطيسية الموجودة في مجاله دون تلامس.' },
            { id: 60, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'العملة المصنوعة من سبيكة النحاس والنيكل لا تنجذب للمغناطيس.', ans: false, exp: 'خطأ: تنجذب للمغناطيس لوجود النيكل وهو مادة مغناطيسية.' },
            { id: 61, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'يرمز للقطب الشمالي للمغناطيس بالرمز (S) والقطب الجنوبي بالرمز (N).', ans: false, exp: 'خطأ: الشمالي (N) والجنوبي (S).' },
            { id: 62, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'عند تقريب ساق ألومنيوم من إبرة البوصلة فإن الإبرة تنحرف بشدة.', ans: false, exp: 'خطأ: لا تتأثر الإبرة لأن الألومنيوم مادة غير مغناطيسية.' },
            { id: 63, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'قطبا المغناطيس هما منطقتان على المغناطيس تكون عندهما قوة الجذب أكبر ما يمكن.', ans: true, exp: 'صواب: ويقعان عند طرفي المغناطيس.' },
            { id: 64, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'إذا قُسِّم مغناطيس إلى 4 أجزاء فإننا نحصل على 4 أقطاب مغناطيسية فقط.', ans: false, exp: 'خطأ: نحصل على 4 مغناطيسات مستقلة لكل منها قطبان (أي 8 أقطاب).' },
            { id: 65, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتشابه القوى المتبادلة بين الشحنات الكهربية مع القوى المتبادلة بين الأقطاب المغناطيسية.', ans: true, exp: 'صواب: في كليهما المتشابه يتنافر والمختلف يتجاذب، وكلاهما قوى مجال.' },
            { id: 66, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تنتهي خطوط المجال المغناطيسي عند القطب الشمالي للمغناطيس.', ans: false, exp: 'خطأ: تبدأ من القطب الشمالي وتنتهي عند القطب الجنوبي.' },
            { id: 67, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تتأثر إبرة البوصلة إذا وُضعت بالقرب من قضيب من الحديد أو مغناطيس آخر.', ans: true, exp: 'صواب: لذا يجب إبعاد البوصلة عن المواد المغناطيسية عند تحديد الاتجاهات.' },

            // --- قوى الجاذبية (33 سؤال) ---
            { id: 68, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'تتشكل الثقوب السوداء عند انكماش النجم الضخم في بداية حياته.', ans: false, exp: 'خطأ: تتشكل عند انكماش نجم ضخم في نهاية حياته.' },
            { id: 69, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'اتجاه قوة الجاذبية الأرضية يكون دائماً لأسفل نحو مركز الأرض.', ans: true, exp: 'صواب: تسحب الأرض جميع الأجسام في اتجاه مركزها.' },
            { id: 70, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'قوى الاحتكاك ليس لها مجال وتعتبر قوى تلامس.', ans: true, exp: 'صواب: لأنها تتطلب تلامساً مادياً بين السطحين.' },
            { id: 71, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'قوة الجاذبية تكون بين الأرض والأجسام الموجودة على سطحها فقط.', ans: false, exp: 'خطأ: قوة الجاذبية تؤثر على الأجسام الموجودة في مجالها عن بعد أيضاً (مثل القمر).' },
            { id: 72, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'تزداد قوة الجذب المتبادلة بين جسمين بزيادة البعد بينهما.', ans: false, exp: 'خطأ: تقل قوة الجاذبية بزيادة المسافة (علاقة عكسية مع مربع المسافة).' },
            { id: 73, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'تستخدم ظاهرة المد والجزر في توليد الكهرباء.', ans: true, exp: 'صواب: كأحد مصادر الطاقة المتجددة النظيفة.' },
            { id: 74, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'كتلة الجسم تساوي قوة جذب الأرض له.', ans: false, exp: 'خطأ: قوة جذب الأرض للجسم هي "وزن الجسم".' },
            { id: 75, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'وزن الجسم يتغير من كوكب إلى آخر نتيجة لتغير شدة مجال جاذبيته.', ans: true, exp: 'صواب: الوزن يتناسب طردياً مع شدة مجال الجاذبية.' },

            { id: 13, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تقريب قطب شمالي لمغناطيس من قطب شمالي لمغناطيس آخر معلق تعليقاً حراً.', ans: 'يبتعد (يتنافر) القطب الشمالي للمغناطيس المعلق؛ لأن الأقطاب المغناطيسية المتشابهة تتنافر.' },
            { id: 14, lesson: 'magnetic', lessonName: 'القوى المغناطيسية', q: 'تقريب فرشاة مغناطيسية من برادة حديد ثم تمريرها برفق على بصمات غير واضحة.', ans: 'تلتصق برادة الحديد بإفرازات البصمة وتظهر معالم البصمة بوضوح وتُرفع الزوائد بالفرشاة المغناطيسية.' },
            { id: 15, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'زيادة مربع المسافة بين مركزي جسمين بالنسبة لقوة الجاذبية بينهما.', ans: 'تقل قوة الجاذبية المتبادلة بين الجسمين (لأن العلاقة عكسية).' },
            { id: 16, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'زيادة كتلة الجسمين بالنسبة لقوة الجاذبية المتبادلة بينهما.', ans: 'تزداد قوة الجاذبية المتبادلة بين الجسمين (لأن العلاقة طردية).' },
            { id: 17, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'عدم وجود قوة الجاذبية الأرضية.', ans: 'لن تستقر الأجسام والكائنات الحية والماء والغلاف الجوي على سطح الأرض وستسبح في الفضاء.' },
            { id: 18, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'انكماش نجم ضخم جداً في نهاية حياته.', ans: 'يتشكل ثقب أسود في الفضاء يتميز بجاذبية هائلة لا يستطيع الضوء الهروب منها.' },
            { id: 19, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'هروب جسم من مجال الجاذبية الأرضية (بالنسبة لكتلته ووزنه).', ans: 'تظل كتلته ثابتة لا تتغير، بينما ينعدم وزنه (يصبح صفراً).' },
            { id: 20, lesson: 'gravity', lessonName: 'قوى الجاذبية', q: 'انتقال جسم من سطح الأرض إلى سطح القمر (بالنسبة لكتلته ووزنه).', ans: 'تظل كتلته ثابتة لا تتغير، بينما يقل وزنه ليصبح سدس (1/6) وزنه على سطح الأرض.' }
        ];

        // ==========================================
        // 2. إدارة الحالة (State Management)
        // ==========================================
        let currentTab = 'mcq';
        let currentLesson = 'all';
        let zoomScale = 1.0;

        const userAnswers = {
            mcq: {},
            tf: {},
            why: {},
            whatif: {}
        };

        // ==========================================
        // 3. دوال التحكم في الزوم (Zoom)
        // ==========================================
        function changeZoom(delta) {
            zoomScale = Math.min(1.5, Math.max(0.7, +(zoomScale + delta).toFixed(1)));
            applyZoom();
        }

        function resetZoom() {
            zoomScale = 1.0;
            applyZoom();
        }

        function applyZoom() {
            const container = document.getElementById('zoom-container');
            const label = document.getElementById('zoom-level');
            label.textContent = `${Math.round(zoomScale * 100)}%`;
            
            if ('zoom' in document.body.style) {
                container.style.zoom = zoomScale;
            } else {
                container.style.transform = `scale(${zoomScale})`;
            }
        }

        // ==========================================
        // 4. دوال التنقل والتصفية وحساب الدرجات
        // ==========================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                btn.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-200');
                const badge = btn.querySelector('span:last-child');
                badge.classList.remove('bg-white/20', 'text-white');
                badge.classList.add('bg-slate-100', 'text-slate-600');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-200');
            activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            const activeBadge = activeBtn.querySelector('span:last-child');
            activeBadge.classList.remove('bg-slate-100', 'text-slate-600');
            activeBadge.classList.add('bg-white/20', 'text-white');

            renderQuestions();
        }

        function filterLesson(lesson) {
            currentLesson = lesson;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.lesson === lesson) {
                    btn.classList.remove('bg-slate-100', 'text-slate-700');
                    btn.classList.add('bg-slate-800', 'text-white');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-white');
                    btn.classList.add('bg-slate-100', 'text-slate-700');
                }
            });
            renderQuestions();
        }

        function updateScore() {
            let score = 0;
            mcqData.forEach(item => {
                if (userAnswers.mcq[item.id] === item.ans) score++;
            });
            tfData.forEach(item => {
                if (userAnswers.tf[item.id] === item.ans) score++;
            });
            document.getElementById('score-value').textContent = `${score} / 200`;
        }

        function resetAllAnswers() {
            userAnswers.mcq = {};
            userAnswers.tf = {};
            userAnswers.why = {};
            userAnswers.whatif = {};
            updateScore();
            renderQuestions();
        }

        function getLessonBadgeStyle(lesson) {
            if (lesson === 'electric') return 'bg-amber-100 text-amber-800 border-amber-200';
            if (lesson === 'magnetic') return 'bg-rose-100 text-rose-800 border-rose-200';
            return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        }

        // ==========================================
        // 5. دوال التفاعل مع الأسئلة
        // ==========================================
        function handleMcqClick(qId, optIdx) {
            if (userAnswers.mcq[qId] !== undefined) return;
            userAnswers.mcq[qId] = optIdx;
            updateScore();
            renderQuestions();
        }

        function handleTfClick(qId, val) {
            if (userAnswers.tf[qId] !== undefined) return;
            userAnswers.tf[qId] = val;
            updateScore();
            renderQuestions();
        }

        function toggleEssayAnswer(type, qId) {
            userAnswers[type][qId] = !userAnswers[type][qId];
            renderQuestions();
        }

        // ==========================================
        // 6. بناء وعرض البطاقات في الصفحة
        // ==========================================
        function renderQuestions() {
            const wrapper = document.getElementById('questions-wrapper');
            wrapper.innerHTML = '';

            let dataList = [];
            if (currentTab === 'mcq') dataList = mcqData;
            else if (currentTab === 'tf') dataList = tfData;
            else if (currentTab === 'why') dataList = whyData;
            else if (currentTab === 'whatif') dataList = whatIfData;

            document.getElementById('count-all').textContent = dataList.length;

            const filtered = currentLesson === 'all' 
                ? dataList 
                : dataList.filter(item => item.lesson === currentLesson);

            if (filtered.length === 0) {
                wrapper.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-slate-200 text-slate-500 font-bold">لا توجد أسئلة مطابقة للتصفية الحالية.</div>`;
                return;
            }

            const letters = ['أ', 'ب', 'جـ', 'د'];

            filtered.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/90 fade-in transition-all hover:shadow-md';

                const headerHtml = `
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="inline-flex items-center justify-center px-3 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-black text-xs sm:text-sm border border-indigo-100">
                            سؤال ${item.id}
                        </span>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold border ${getLessonBadgeStyle(item.lesson)}">
                            ${item.lessonName}
                        </span>
                    </div>
                `;

                if (currentTab === 'mcq') {
                    const userChoice = userAnswers.mcq[item.id];
                    const isAnswered = userChoice !== undefined;

                    let optionsHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-4">`;
                    item.options.forEach((opt, idx) => {
                        let btnClass = 'bg-slate-50 hover:bg-indigo-50/70 border-slate-200 text-slate-800';
                        let iconHtml = `<span class="w-7 h-7 rounded-lg bg-white border border-slate-300 text-slate-600 flex items-center justify-center text-xs font-black shrink-0">${letters[idx]}</span>`;

                        if (isAnswered) {
                            if (idx === item.ans) {
                                btnClass = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-500/20 font-bold';
                                iconHtml = `<span class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-sm font-black shrink-0">✓</span>`;
                            } else if (idx === userChoice && userChoice !== item.ans) {
                                btnClass = 'bg-rose-50 border-rose-500 text-rose-950 opacity-90';
                                iconHtml = `<span class="w-7 h-7 rounded-lg bg-rose-600 text-white flex items-center justify-center text-sm font-black shrink-0">✕</span>`;
                            } else {
                                btnClass = 'bg-slate-50/60 border-slate-200 text-slate-400 opacity-60';
                            }
                        }

                        optionsHtml += `
                            <button onclick="handleMcqClick(${item.id}, ${idx})" ${isAnswered ? 'disabled' : ''} 
                                class="option-btn w-full text-right p-3 rounded-xl border-2 flex items-center gap-3 text-sm sm:text-base font-semibold ${btnClass}">
                                ${iconHtml}
                                <span>${opt}</span>
                            </button>
                        `;
                    });
                    optionsHtml += `</div>`;

                    const feedbackHtml = isAnswered ? `
                        <div class="mt-4 p-3.5 rounded-xl text-xs sm:text-sm font-bold flex items-start gap-2.5 fade-in ${userChoice === item.ans ? 'bg-emerald-50/80 text-emerald-900 border border-emerald-200' : 'bg-amber-50/90 text-amber-950 border border-amber-200'}">
                            <span class="text-lg leading-none">${userChoice === item.ans ? '🎉' : '💡'}</span>
                            <div>
                                <p class="font-extrabold mb-0.5">${userChoice === item.ans ? 'إجابة صحيحة! أحسنت.' : `إجابة غير صحيحة! الإجابة الصحيحة هي: (${item.options[item.ans]})`}</p>
                                <p class="font-medium opacity-90">${item.exp}</p>
                            </div>
                        </div>
                    ` : '';

                    card.innerHTML = `
                        ${headerHtml}
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-800 leading-relaxed">${item.q}</h3>
                        ${optionsHtml}
                        ${feedbackHtml}
                    `;
                }

                else if (currentTab === 'tf') {
                    const userChoice = userAnswers.tf[item.id];
                    const isAnswered = userChoice !== undefined;

                    const getTfBtnStyle = (btnVal) => {
                        if (!isAnswered) {
                            return btnVal 
                                ? 'bg-slate-50 hover:bg-emerald-50 border-slate-200 hover:border-emerald-400 text-slate-800'
                                : 'bg-slate-50 hover:bg-rose-50 border-slate-200 hover:border-rose-400 text-slate-800';
                        }
                        if (btnVal === item.ans) {
                            return 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-500/20 font-extrabold';
                        }
                        if (btnVal === userChoice && userChoice !== item.ans) {
                            return 'bg-rose-50 border-rose-500 text-rose-950 font-bold';
                        }
                        return 'bg-slate-50/50 border-slate-200 text-slate-400 opacity-60';
                    };

                    const feedbackHtml = isAnswered ? `
                        <div class="mt-4 p-3.5 rounded-xl text-xs sm:text-sm font-bold flex items-start gap-2.5 fade-in ${userChoice === item.ans ? 'bg-emerald-50/80 text-emerald-900 border border-emerald-200' : 'bg-amber-50/90 text-amber-950 border border-amber-200'}">
                            <span class="text-lg leading-none">${userChoice === item.ans ? '🌟' : '📌'}</span>
                            <div>
                                <p class="font-extrabold mb-0.5">${userChoice === item.ans ? 'إجابة صحيحة!' : `إجابة خاطئة! العبارة (${item.ans ? 'صحيحة ✓' : 'غير صحيحة ✕'})`}</p>
                                <p class="font-medium opacity-90">${item.exp}</p>
                            </div>
                        </div>
                    ` : '';

                    card.innerHTML = `
                        ${headerHtml}
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-800 leading-relaxed">${item.q}</h3>
                        <div class="grid grid-cols-2 gap-3 mt-4">
                            <button onclick="handleTfClick(${item.id}, true)" ${isAnswered ? 'disabled' : ''} 
                                class="p-3 rounded-xl border-2 flex items-center justify-center gap-2 text-sm sm:text-base font-bold transition ${getTfBtnStyle(true)}">
                                <span class="text-emerald-600 text-lg">✔</span> صواب
                            </button>
                            <button onclick="handleTfClick(${item.id}, false)" ${isAnswered ? 'disabled' : ''} 
                                class="p-3 rounded-xl border-2 flex items-center justify-center gap-2 text-sm sm:text-base font-bold transition ${getTfBtnStyle(false)}">
                                <span class="text-rose-600 text-lg">✘</span> خطأ
                            </button>
                        </div>
                        ${feedbackHtml}
                    `;
                }

                else if (currentTab === 'why' || currentTab === 'whatif') {
                    const isRevealed = !!userAnswers[currentTab][item.id];
                    const prefix = currentTab === 'why' ? 'علل لما يأتي: ' : 'ماذا يحدث عند: ';

                    card.innerHTML = `
                        ${headerHtml}
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-800 leading-relaxed">
                            <span class="text-indigo-600">${prefix}</span>${item.q}
                        </h3>
                        <div class="mt-4">
                            <button onclick="toggleEssayAnswer('${currentTab}', ${item.id})" 
                                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-2 shadow-sm ${isRevealed ? 'bg-slate-200 text-slate-800 hover:bg-slate-300' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">
                                <span>${isRevealed ? '🙈 إخفاء الإجابة النموذجية' : '👁️ عرض الإجابة النموذجية'}</span>
                            </button>
                        </div>
                        ${isRevealed ? `
                            <div class="mt-4 p-4 rounded-xl bg-emerald-50/90 border-r-4 border-emerald-500 text-emerald-950 text-sm sm:text-base font-bold leading-relaxed fade-in">
                                <span class="block text-xs font-black text-emerald-700 mb-1">الإجابة النموذجية:</span>
                                ${item.ans}
                            </div>
                        ` : ''}
                    `;
                }

                wrapper.appendChild(card);
            });
        }

        window.onload = () => {
            renderQuestions();
        };
    </script>
</body>
</html>
